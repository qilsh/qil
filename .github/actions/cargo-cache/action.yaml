name: cargo-cache

inputs:
  cache-suffix:
    required: true

runs:
  using: composite
  steps:
    - name: cache dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: ${{ runner.os }}-cargo-deps-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-deps-

    - name: cache build
      uses: actions/cache@v6
      with:
        path: target/
        key: ${{ runner.os }}-cargo-build-${{ inputs.cache-suffix }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-build-${{ inputs.cache-suffix }}-
